

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="shortcut icon" href="assets/img/un.png" type="image/x-icon">
    <title>Login</title>
    <style>
        body {
            background-image: url('assets/img/km.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>

<body>

    <!-- navbar awal -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm me-5">
        <div class="container">
            <img src="assets/img/imdklogo.png" alt="logo" width="200">
            <a class="navbar-brand ps-3" href="#"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
            </div>
        </div>
    </nav>
    <!-- navbar akhir -->

    <!--Login-->
    <div class="container col-lg-4 md-5">
        <div style="margin-top:40px;"></div>
        <div class="card">
            <div class="card-body">
                <img src="assets/img/imdklogo.png" alt="logo" width="200" style="margin-right:auto; display:flex; margin-left:auto; margin-bottom:10px;">
                <h6 class="text-center">Registered Customer</h6>
                <hr>
                <form action="" method="post" id="loginForm">
                    <div class="mb-auto">
                        <label for="username" class="form-label"></label>
                        <input type="text" name="username" class="form-control" id="username" placeholder="Username">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label"></label>
                        <input type="password" name="password" class="form-control" id="password" placeholder="Password">
                    </div>
                    <button type="submit" name="login" class="btn btn-danger" style=" width:100%; height: 48px;">Masuk</button>
                     
                </button>
                </form>
            </div>
        </div>
    </div>
    <!--end-->
    <!--cdn jsbootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>

    <script>
        window.addEventListener("load", function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn')
            
            if (isLoggedIn) {
                window.location.href = 'dashboard.html';
            }
        });

        const dummyUserData = [
            {
                username: 'user1',
                password: 'password1'
            },
            {
                username: 'user2',
                password: 'password2'
            },
        ];

        // Mendapatkan elemen-elemen form
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    // Menangani submit form
    loginForm.addEventListener('submit', function(event) {
        event.preventDefault(); // Mencegah form dari pengiriman default

        const enteredUsername = usernameInput.value;
        const enteredPassword = passwordInput.value;

        // Memeriksa apakah data pengguna ada di data dummy
        const user = dummyUserData.find(user => user.username === enteredUsername && user.password === enteredPassword);

        if (user) {
            // Jika data pengguna cocok, redirect ke halaman index.html
            localStorage.setItem('isLoggedIn', "1");

            window.location.href = 'dashboard.html';
        } else {
            // Jika tidak cocok, tampilkan pesan kesalahan
            alert('Username atau kata sandi salah. Silakan coba lagi.');
        }
    });

    </script>
</body>

</html>
